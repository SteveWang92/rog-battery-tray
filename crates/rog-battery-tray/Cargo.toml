[package]
name = "rog-battery-tray"
version = "0.0.0"
description = "Windows tray battery monitor for ASUS ROG wireless peripherals"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rog-battery = { path = "../rog-battery" }
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader"] }
winreg = "0.56.0"
